<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>インベーダーゲーム</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a1a;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Courier New', monospace;
    color: #fff;
  }
  h1 {
    color: #0f0;
    margin-bottom: 10px;
    font-size: 20px;
    text-shadow: 0 0 10px #0f0;
  }
  #hud {
    width: 480px;
    display: flex;
    justify-content: space-between;
    margin-bottom: 8px;
    font-size: 14px;
    color: #0ff;
  }
  canvas {
    border: 2px solid #0f0;
    box-shadow: 0 0 20px rgba(0,255,0,0.3);
    background: #000;
    display: block;
  }
  #msg { margin-top: 10px; font-size: 14px; color: #888; }
  .author { margin-top: 8px; font-size: 12px; color: #666; }
</style>
</head>
<body>
<h1>SPACE INVADERS</h1>
<div id="hud">
  <span>SCORE: <span id="score">0</span></span>
  <span>LIVES: <span id="lives">3</span></span>
  <span>LEVEL: <span id="level">1</span></span>
</div>
<canvas id="game" width="480" height="560"></canvas>
<div id="msg">← → で移動、スペースで射撃、Pでポーズ</div>
<div class="author">作成者: qwen/qwen3.8-27b</div>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

const scoreEl = document.getElementById('score');
const livesEl = document.getElementById('lives');
const levelEl = document.getElementById('level');
const msgEl = document.getElementById('msg');

const keys = {};
document.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (['Space','ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.code)) e.preventDefault();
  if (e.code === 'KeyP' && state === 'playing') state = 'paused';
  else if (e.code === 'KeyP' && state === 'paused') state = 'playing';
  if ((e.code === 'Enter' || e.code === 'Space') && (state === 'gameover' || state === 'start')) start();
});
document.addEventListener('keyup', e => keys[e.code] = false);

let state = 'start'; // start | playing | paused | gameover
let freezeTimer = 0;
let score = 0, lives = 3, level = 1;
let player, bullets = [], enemyBullets = [], invaders = [], shields = [], particles = [];
let invaderDir, invaderSpeed, invaderStepTimer, invaderFireTimer;
let frame = 0;

// ---- pixel-art sprites ----
const SPRITES = {
  invader0: [
    ['..X.....X..',
     '...X...X...',
     '..XXXXXXX..',
     '.XX.XXX.XX.',
     'XXXXXXXXXXX',
     'X.XXXXXXX.X',
     'X.X.....X.X',
     '...XX.XX...'],
    ['..X.....X..',
     '...X...X...',
     '..XXXXXXX..',
     '.XX.XXX.XX.',
     'XXXXXXXXXXX',
     'X.XXXXXXX.X',
     '.X......X..',
     '..X.....X..']
  ],
  invader1: [
    ['...XX.XX...',
     '..XXXXXXX..',
     '.XXXXXXXXX.',
     'XX.XXX.XXX',
     'XXXXXXXXXXX',
     '..X.XXX.X..',
     '.X..XXX..X.',
     '.X..XXX..X.'],
    ['...XX.XX...',
     '..XXXXXXX..',
     '.XXXXXXXXX.',
     'XX.XXX.XXX',
     'XXXXXXXXXXX',
     '..X.XXX.X..',
     '.XX.XXX.XX.',
     '..XX...XX..']
  ],
  invader2: [
    ['....XXX....',
     '.XXXXXXXXX.',
     'XXXXXXXXXXX',
     'XXXXXXXXXXX',
     '.XX.XXX.XX.',
     '.X..XXX..X.',
     '..X.XXX.X..',
     'X..XX.XX..X'],
    ['....XXX....',
     '.XXXXXXXXX.',
     'XXXXXXXXXXX',
     'XXXXXXXXXXX',
     '.XX.XXX.XX.',
     '.X..XXX..X.',
     '...XXXX....',
     '..X..X..X..']
  ],
  player: [
    '......X......',
    '.....XXX.....',
    '.....XXX.....',
    'XXXXXXXXXXXXX',
    'XXXXXXXXXXXXX',
    'XXXXXXXXXXXXX',
  ],
  shield: [
    'XXXXX',
    'X...X',
    'X...X',
    'X...X',
    'XXXXX'
  ]
};

const INVADER_COLORS = ['#0f0', '#0ff', '#f0f'];
const CELL = 5;

function drawSprite(sprite, x, y, color, scale = 1) {
  ctx.fillStyle = color;
  const h = sprite.length, w = sprite[0].length;
  for (let r = 0; r < h; r++) {
    for (let c = 0; c < w; c++) {
      if (sprite[r][c] === 'X') {
        ctx.fillRect(x + c * CELL * scale, y + r * CELL * scale, CELL * scale, CELL * scale);
      }
    }
  }
}

function makeShield(x) {
  const cells = [];
  const spr = SPRITES.shield;
  const s = 6;
  for (let r = 0; r < spr.length; r++)
    for (let c = 0; c < spr[r].length; c++)
      if (spr[r][c] === 'X') cells.push({ x: x + c * s, y: 470 + r * s, w: s, h: s, hp: 3 });
  return cells;
}

function start() {
  score = 0; lives = 3; level = 1;
  setupLevel();
  state = 'playing';
}

function setupLevel() {
  player = { x: W / 2 - 22, y: H - 60, w: 44, h: 18, cooldown: 0, invincible: 0 };
  bullets = [];
  enemyBullets = [];
  particles = [];
  shields = [...makeShield(70), ...makeShield(180), ...makeShield(290), ...makeShield(400)].flat();

  invaders = [];
  const cols = 11, rows = 5;
  const ox = 45, oy = 70;
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      invaders.push({
        x: ox + c * 34, y: oy + r * 28,
        w: 28, h: 18,
        type: r === 0 ? 2 : (r <= 2 ? 1 : 0),
        alive: true
      });
    }
  }
  invaderDir = 1;
  invaderSpeed = 1.2 + (level - 1) * 0.4;
  invaderStepTimer = 0;
  invaderStepInterval = Math.max(12, 40 - level * 3);
  invaderFireTimer = 0;
  updateHUD();
}

function updateHUD() {
  scoreEl.textContent = score;
  livesEl.textContent = lives;
  levelEl.textContent = level;
}

function spawnParticles(x, y, color, n = 12) {
  for (let i = 0; i < n; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 6,
      vy: (Math.random() - 0.5) * 6,
      life: 20 + Math.random() * 20,
      color
    });
  }
}

function shieldHit(sx, sy) {
  for (const s of shields) {
    if (sx >= s.x && sx <= s.x + s.w && sy >= s.y && sy <= s.y + s.h) {
      s.hp--;
      if (s.hp <= 0) shields = shields.filter(o => o !== s);
      return true;
    }
  }
  return false;
}

function rectHit(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

function update() {
  frame++;

  // freeze: 自機が敵弾に当たった後の1.5秒の間、全オブジェクトの更新を停止
  if (state === 'freeze') {
    freezeTimer--;
    if (freezeTimer <= 0) state = 'playing';
    // 粒子だけ更新
    particles = particles.filter(p => {
      p.x += p.vx; p.y += p.vy; p.life--;
      return p.life > 0;
    });
    return;
  }

  // player move
  const speed = 5;
  if (keys['ArrowLeft'] || keys['KeyA']) player.x -= speed;
  if (keys['ArrowRight'] || keys['KeyD']) player.x += speed;
  player.x = Math.max(0, Math.min(W - player.w, player.x));

  // shoot
  if (player.cooldown > 0) player.cooldown--;
  if (keys['Space'] && player.cooldown === 0) {
    bullets.push({ x: player.x + player.w / 2 - 2, y: player.y - 8, w: 4, h: 10, vy: -8 });
    player.cooldown = 15;
  }

  // bullets
  bullets = bullets.filter(b => {
    b.y += b.vy;
    if (b.y < -20) return false;
    // vs shields
    for (const s of shields) {
      if (rectHit(b, s)) { s.hp--; if (s.hp <= 0) shields = shields.filter(o => o !== s); return false; }
    }
    // vs invaders
    for (const inv of invaders) {
      if (inv.alive && rectHit(b, inv)) {
        inv.alive = false;
        score += (3 - inv.type) * 10;
        spawnParticles(b.x + b.w/2, b.y + b.h/2, INVADER_COLORS[inv.type]);
        updateHUD();
        if (invaders.every(i => !i.alive)) { level++; setupLevel(); }
        return false;
      }
    }
    return true;
  });

  // enemy bullets
  enemyBullets = enemyBullets.filter(b => {
    b.y += b.vy;
    if (b.y > H + 20) return false;
    for (const s of shields) {
      if (rectHit(b, s)) { s.hp--; if (s.hp <= 0) shields = shields.filter(o => o !== s); return false; }
    }
    if (player.invincible === 0 && rectHit(b, player)) {
      lives--;
      updateHUD();
      spawnParticles(player.x + player.w/2, player.y + player.h/2, '#fff');
      if (lives <= 0) {
        state = 'gameover';
      } else {
        // 1.5秒フリーズ
        state = 'freeze';
        freezeTimer = 90; // 60fps×1.5秒
      }
      return false;
    }
    return true;
  });

  // invaders: step movement
  invaderStepTimer++;
  const aliveInvaders = invaders.filter(i => i.alive);
  if (aliveInvaders.length === 0) return;
  const speedFactor = aliveInvaders.length / 55;
  const interval = Math.max(4, Math.floor(invaderStepInterval * speedFactor));
  if (invaderStepTimer >= interval) {
    invaderStepTimer = 0;
    const minX = Math.min(...aliveInvaders.map(i => i.x));
    const maxX = Math.max(...aliveInvaders.map(i => i.x + i.w));
    const hitEdge = (invaderDir > 0 && maxX >= W - 10) || (invaderDir < 0 && minX <= 10);
    if (hitEdge) {
      invaderDir *= -1;
      // 端まで移動したら下がる(ジグザグ)
      for (const inv of invaders) {
        if (!inv.alive) continue;
        inv.y += 6;
      }
    } else {
      // 端でない間は横移動のみ
      for (const inv of invaders) {
        if (!inv.alive) continue;
        inv.x += invaderDir * invaderSpeed * 2;
      }
    }
    // invaders reach bottom
    if (Math.max(...aliveInvaders.map(i => i.y + i.h)) >= player.y) {
      lives = 0; updateHUD(); state = 'gameover';
    }
  }

  // invader fire
  invaderFireTimer++;
  const fireInterval = Math.max(30, 90 - level * 8);
  if (invaderFireTimer >= fireInterval && aliveInvaders.length > 0) {
    invaderFireTimer = 0;
    // fire from a random bottom-row invader column
    const bottomMap = {};
    for (const inv of aliveInvaders) {
      const col = Math.round(inv.x / 34);
      if (!bottomMap[col] || inv.y > bottomMap[col].y) bottomMap[col] = inv;
    }
    const shooters = Object.values(bottomMap);
    const shooter = shooters[Math.floor(Math.random() * shooters.length)];
    enemyBullets.push({ x: shooter.x + shooter.w / 2 - 2, y: shooter.y + shooter.h, w: 4, h: 10, vy: (3.5 + level * 0.3) * 2 });
  }

  // particles
  particles = particles.filter(p => {
    p.x += p.vx; p.y += p.vy; p.life--;
    return p.life > 0;
  });
}

function draw() {
  ctx.clearRect(0, 0, W, H);

  // stars
  ctx.fillStyle = '#222';
  for (let i = 0; i < 40; i++) {
    const sx = (i * 137 + 50) % W;
    const sy = (i * 89 + 30) % H;
    ctx.fillRect(sx, sy, 2, 2);
  }

  // shields
  ctx.fillStyle = '#0a0';
  if (shields) for (const s of shields) ctx.fillRect(s.x, s.y, s.w, s.h);

  // invaders
  const animFrame = Math.floor(frame / 8) % 2;
  if (invaders) for (const inv of invaders) {
    if (!inv.alive) continue;
    const sprite = [SPRITES.invader0, SPRITES.invader1, SPRITES.invader2][inv.type][animFrame];
    drawSprite(sprite, inv.x, inv.y, INVADER_COLORS[inv.type], 0.6);
  }

  // player
  if (state !== 'gameover' && state !== 'freeze' && player) {
    const blink = player.invincible > 0 && Math.floor(frame / 4) % 2 === 0;
    if (!blink) drawSprite(SPRITES.player, player.x, player.y, '#0ff', 1);
  }

  // bullets
  ctx.fillStyle = '#ff0';
  if (bullets) for (const b of bullets) ctx.fillRect(b.x, b.y, b.w, b.h);
  ctx.fillStyle = '#f66';
  if (enemyBullets) for (const b of enemyBullets) ctx.fillRect(b.x, b.y, b.w, b.h);

  // particles
  if (particles) for (const p of particles) {
    ctx.globalAlpha = Math.min(1, p.life / 20);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x, p.y, 3, 3);
  }
  ctx.globalAlpha = 1;

  // overlays
  if (state === 'start' || state === 'paused' || state === 'freeze' || state === 'gameover') {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    if (state === 'start') {
      ctx.fillStyle = '#0f0';
      ctx.font = 'bold 28px "Courier New"';
      ctx.fillText('SPACE INVADERS', W/2, H/2 - 30);
      ctx.fillStyle = '#fff';
      ctx.font = '16px "Courier New"';
      ctx.fillText('ENTER or SPACE で開始', W/2, H/2 + 10);
    } else if (state === 'paused') {
      ctx.fillStyle = '#0f0';
      ctx.font = 'bold 28px "Courier New"';
      ctx.fillText('PAUSE', W/2, H/2 - 10);
      ctx.fillStyle = '#fff';
      ctx.font = '16px "Courier New"';
      ctx.fillText('Pで再開', W/2, H/2 + 20);
    } else if (state === 'freeze') {
      ctx.fillStyle = '#f44';
      ctx.font = 'bold 32px "Courier New"';
      ctx.fillText('HIT!', W/2, H/2 - 10);
    } else {
      ctx.fillStyle = '#f44';
      ctx.font = 'bold 28px "Courier New"';
      ctx.fillText('GAME OVER', W/2, H/2 - 30);
      ctx.fillStyle = '#fff';
      ctx.font = '16px "Courier New"';
      ctx.fillText('SCORE: ' + score, W/2, H/2 + 10);
      ctx.fillText('ENTER or SPACE で再開', W/2, H/2 + 40);
    }
    ctx.textAlign = 'left';
  }
}

function loop() {
  if (state === 'playing' || state === 'freeze') update();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
