<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="author" content="qwen/qwen3.8-27b">
<title>ブロック崩し</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #0d1117;
    font-family: 'Segoe UI', 'Hiragino Kaku Gothic ProN', sans-serif;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
  }
  #wrap {
    position: relative;
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
  }
  canvas { display: block; background: #0d1117; }
  #hud {
    position: absolute;
    top: 0; left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 14px;
    color: #e6edf3; font-size: 15px; pointer-events: none;
  }
  #hud .item { margin: 0 6px; white-space: nowrap; }
  #hud .label { color: #8b949e; font-size: 12px; display: block; text-align: center; }
  #overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: rgba(13, 17, 23, 0.85);
    color: #e6edf3; text-align: center; z-index: 10;
  }
  #overlay h1 { font-size: 28px; margin-bottom: 12px; }
  #overlay p { font-size: 15px; color: #8b949e; margin-bottom: 20px; line-height: 1.7; }
  #overlay button {
    font-size: 18px; padding: 12px 36px;
    background: #238636; color: #fff; border: none; border-radius: 8px;
    cursor: pointer;
  }
  #overlay button:active { background: #2ea043; }
  #overlay .author { margin-top: 20px; font-size: 12px; color: #6e7681; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
  <div id="hud">
    <div class="item"><span class="label">スコア</span><span id="score">0</span></div>
    <div class="item"><span class="label">ライフ</span><span id="lives">3</span></div>
    <div class="item"><span class="label">レベル</span><span id="level">1</span></div>
  </div>
  <div id="overlay">
    <h1 id="ov-title">ブロック崩し</h1>
    <p id="ov-msg">パドルを左右に動かしてブロックを壊そう。<br>マウス / タッチ / 矢印キーで操作</p>
    <button id="ov-btn">スタート</button>
    <div class="author">作成者: qwen/qwen3.8-27b</div>
  </div>
</div>
<script>
(function () {
  'use strict';

  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var scoreEl = document.getElementById('score');
  var livesEl = document.getElementById('lives');
  var levelEl = document.getElementById('level');
  var overlay = document.getElementById('overlay');
  var ovTitle = document.getElementById('ov-title');
  var ovMsg = document.getElementById('ov-msg');
  var ovBtn = document.getElementById('ov-btn');

  // --- 論理サイズ(固定) ---
  var W = 420, H = 640;
  var DPR = 1;

  // --- 状態 ---
  var state = 'menu'; // menu | play | ballWait | levelClear | gameover
  var score = 0, lives = 3, level = 1;
  var ballSpeedBase = 10.4;

  var paddle = { w: 84, h: 14, x: 0, y: 0, targetX: 0 };
  var ball = { x: 0, y: 0, vx: 0, vy: 0, r: 7, stuck: true };
  var bricks = [];
  var ROWS = 5, COLS = 6, BRICK_GAP = 6, BRICK_TOP = 60, BRICK_SIDE = 14;
  var BRICK_H = 22;
  var ROW_COLORS = ['#f85149', '#db6d28', '#d29922', '#3fb950', '#58a6ff'];

  function brickW() {
    return (W - BRICK_SIDE * 2 - BRICK_GAP * (COLS - 1)) / COLS;
  }

  function resetPaddle() {
    paddle.w = Math.max(40, 84 - (level - 1) * 8);
    paddle.y = H - 50;
    paddle.x = paddle.targetX = (W - paddle.w) / 2;
  }

  function resetBall() {
    ball.stuck = true;
    ball.x = paddle.x + paddle.w / 2;
    ball.y = paddle.y - ball.r - 2;
    ball.vx = 0; ball.vy = 0;
  }

  function launchBall() {
    ball.stuck = false;
    var speed = ballSpeedBase * (1 + (level - 1) * 0.2);
    var angle = (Math.random() * 40 - 20) * Math.PI / 180; // -20..20度
    ball.vx = Math.sin(angle) * speed;
    ball.vy = -Math.cos(angle) * speed;
  }

  function buildBricks() {
    bricks = [];
    var bw = brickW();
    for (var r = 0; r < ROWS; r++) {
      for (var c = 0; c < COLS; c++) {
        bricks.push({
          x: BRICK_SIDE + c * (bw + BRICK_GAP),
          y: BRICK_TOP + r * (BRICK_H + BRICK_GAP),
          w: bw, h: BRICK_H,
          color: ROW_COLORS[r],
          alive: true
        });
      }
    }
  }

  function startLevel() {
    resetPaddle();
    resetBall();
    buildBricks();
    state = 'ballWait';
  }

  function newGame() {
    score = 0; lives = 3; level = 1;
    updateHUD();
    startLevel();
  }

  function updateHUD() {
    scoreEl.textContent = score;
    livesEl.textContent = lives;
    levelEl.textContent = level;
  }

  // --- 入力 ---
  function paddleFromClientX(clientX) {
    var rect = canvas.getBoundingClientRect();
    var x = (clientX - rect.left) / rect.width * W;
    paddle.targetX = Math.max(0, Math.min(W - paddle.w, x - paddle.w / 2));
  }

  canvas.addEventListener('mousemove', function (e) {
    if (state === 'play' || state === 'ballWait') paddleFromClientX(e.clientX);
  });

  canvas.addEventListener('touchstart', function (e) {
    e.preventDefault();
    if (state === 'ballWait') { launchBall(); state = 'play'; return; }
    if (e.touches.length) paddleFromClientX(e.touches[0].clientX);
  }, { passive: false });

  canvas.addEventListener('touchmove', function (e) {
    e.preventDefault();
    if (state === 'play' || state === 'ballWait') {
      if (e.touches.length) paddleFromClientX(e.touches[0].clientX);
    }
  }, { passive: false });

  canvas.addEventListener('click', function () {
    if (state === 'ballWait') { launchBall(); state = 'play'; }
  });

  var keys = {};
  window.addEventListener('keydown', function (e) {
    keys[e.key] = true;
    if ((e.key === ' ' || e.key === 'ArrowUp') && state === 'ballWait') {
      launchBall(); state = 'play'; e.preventDefault();
    }
  });
  window.addEventListener('keyup', function (e) { keys[e.key] = false; });

  ovBtn.addEventListener('click', function () {
    overlay.classList.add('hidden');
    if (state === 'levelClear') {
      startLevel();
    } else {
      newGame();
    }
  });

  // --- 更新 ---
  function update() {
    // パドル追従
    if (keys['ArrowLeft']) paddle.targetX = Math.max(0, paddle.targetX - 9);
    if (keys['ArrowRight']) paddle.targetX = Math.min(W - paddle.w, paddle.targetX + 9);
    paddle.x += (paddle.targetX - paddle.x) * 0.35;

    if (state !== 'play') {
      if (state === 'ballWait' && ball.stuck) {
        ball.x = paddle.x + paddle.w / 2;
        ball.y = paddle.y - ball.r - 2;
      }
      return;
    }

    ball.x += ball.vx;
    ball.y += ball.vy;

    // 壁
    if (ball.x - ball.r < 0) { ball.x = ball.r; ball.vx = Math.abs(ball.vx); }
    if (ball.x + ball.r > W) { ball.x = W - ball.r; ball.vx = -Math.abs(ball.vx); }
    if (ball.y - ball.r < 0) { ball.y = ball.r; ball.vy = Math.abs(ball.vy); }

    // 落下
    if (ball.y - ball.r > H) {
      lives--;
      updateHUD();
      if (lives <= 0) {
        state = 'gameover';
        showOverlay('ゲームオーバー', 'スコア: ' + score + '\nもう一度挑戦！', 'もう一度');
        ovMsg.innerText = 'スコア: ' + score + '\nもう一度挑戦！';
      } else {
        state = 'ballWait';
        resetBall();
      }
      return;
    }

    // パドル
    if (ball.vy > 0 &&
        ball.y + ball.r >= paddle.y && ball.y + ball.r <= paddle.y + paddle.h + 8 &&
        ball.x >= paddle.x - ball.r && ball.x <= paddle.x + paddle.w + ball.r) {
      var hit = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2); // -1..1
      var maxAngle = 60 * Math.PI / 180;
      var speed = Math.sqrt(ball.vx * ball.vx + ball.vy * ball.vy);
      var angle = hit * maxAngle;
      ball.vx = Math.sin(angle) * speed;
      ball.vy = -Math.cos(angle) * speed;
      ball.y = paddle.y - ball.r;
    }

    // ブロック
    for (var i = 0; i < bricks.length; i++) {
      var b = bricks[i];
      if (!b.alive) continue;
      if (ball.x + ball.r < b.x || ball.x - ball.r > b.x + b.w ||
          ball.y + ball.r < b.y || ball.y - ball.r > b.y + b.h) continue;

      b.alive = false;
      score += 10 * level;
      updateHUD();

      // 反発方向
      var overlapL = (ball.x + ball.r) - b.x;
      var overlapR = (b.x + b.w) - (ball.x - ball.r);
      var overlapT = (ball.y + ball.r) - b.y;
      var overlapB = (b.y + b.h) - (ball.y - ball.r);
      var min = Math.min(overlapL, overlapR, overlapT, overlapB);
      if (min === overlapL || min === overlapR) ball.vx = -ball.vx;
      else ball.vy = -ball.vy;

      if (bricks.every(function (k) { return !k.alive; })) {
        level++;
        updateHUD();
        state = 'levelClear';
        showOverlay('レベル ' + (level - 1) + ' クリア！', '次のレベル: ' + level, '次へ');
        return;
      }
      break;
    }
  }

  function showOverlay(title, msg, btn) {
    ovTitle.textContent = title;
    ovMsg.innerHTML = msg;
    ovBtn.textContent = btn;
    overlay.classList.remove('hidden');
  }

  // --- 描画 ---
  function draw() {
    ctx.clearRect(0, 0, W, H);

    // 左右の壁
    var wallW = 4;
    ctx.fillStyle = 'rgba(88, 166, 255, 0.35)';
    ctx.fillRect(0, 0, wallW, H);
    ctx.fillRect(W - wallW, 0, wallW, H);
    ctx.fillStyle = '#58a6ff';
    ctx.fillRect(0, 0, 1.5, H);
    ctx.fillRect(W - 1.5, 0, 1.5, H);

    // ブロック
    for (var i = 0; i < bricks.length; i++) {
      var b = bricks[i];
      if (!b.alive) continue;
      ctx.fillStyle = b.color;
      roundRect(ctx, b.x, b.y, b.w, b.h, 4);
    }

    // パドル
    ctx.fillStyle = '#e6edf3';
    roundRect(ctx, paddle.x, paddle.y, paddle.w, paddle.h, 7);

    // ボール
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
    ctx.fillStyle = '#f0f6fc';
    ctx.fill();

    if (state === 'ballWait') {
      ctx.fillStyle = 'rgba(230,237,243,0.7)';
      ctx.font = '14px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('タップ / クリック / スペース で発射', W / 2, H - 90);
    }
  }

  function roundRect(c, x, y, w, h, r) {
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
    c.fill();
  }

  // --- リサイズ ---
  function resize() {
    DPR = window.devicePixelRatio || 1;
    var wrap = document.getElementById('wrap');
    var cw = wrap.clientWidth, ch = wrap.clientHeight;
    var scale = Math.min(cw / W, ch / H);
    var dispW = W * scale, dispH = H * scale;
    canvas.style.width = dispW + 'px';
    canvas.style.height = dispH + 'px';
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);

  // --- メインループ ---
  var last = 0;
  function loop(t) {
    if (t - last >= 1000 / 60) {
      last = t;
      update();
      draw();
    }
    requestAnimationFrame(loop);
  }

  resize();
  resetPaddle();
  resetBall();
  buildBricks();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
